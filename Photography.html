  <style>
    /* Scrolling flag banner */
    .flag-banner {
      overflow: hidden;
      padding: 12px 0;
      margin: 0 0 40px;
      border: 1px solid rgba(139, 229, 255, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .flag-track {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 18s linear infinite;
    }

    .flag-item {
      flex: 0 0 auto;
      width: 44px;
      height: 30px;
      overflow: hidden;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .flag-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flag-track { animation: none; }
    }
  </style>

  <script>
  // Build and animate the flag banner
  (function() {
    const track = document.getElementById('flag-track');
    if (!track) return;

    const createFlagItem = (code, name) => {
      const item = document.createElement('div');
      item.className = 'flag-item';
      const img = document.createElement('img');
      img.src = `https://flagcdn.com/w40/${code}.png`;
      img.alt = `${name} flag`;
      img.loading = 'lazy';
      item.appendChild(img);
      return item;
    };

    const fillTrack = countries => {
      track.innerHTML = '';
      const items = countries.map(country => createFlagItem(country.code, country.name));
      items.forEach(item => track.appendChild(item));
      items.forEach(item => track.appendChild(item.cloneNode(true)));

      const containerWidth = track.parentElement.offsetWidth || window.innerWidth;
      while (track.scrollWidth < containerWidth * 2) {
        items.forEach(item => track.appendChild(item.cloneNode(true)));
      }

      const duration = Math.max(14, Math.round(track.children.length * 0.15));
      track.style.animationDuration = `${duration}s`;
    };

    const fallbackFlags = [
      {code: 'us', name: 'United States'},
      {code: 'gb', name: 'United Kingdom'},
      {code: 'fr', name: 'France'},
      {code: 'de', name: 'Germany'},
      {code: 'jp', name: 'Japan'},
      {code: 'br', name: 'Brazil'},
      {code: 'in', name: 'India'},
      {code: 'cn', name: 'China'},
      {code: 'za', name: 'South Africa'},
      {code: 'au', name: 'Australia'},
      {code: 'ca', name: 'Canada'},
      {code: 'es', name: 'Spain'},
      {code: 'it', name: 'Italy'},
      {code: 'nl', name: 'Netherlands'},
      {code: 'se', name: 'Sweden'},
      {code: 'kr', name: 'South Korea'},
      {code: 'mx', name: 'Mexico'},
      {code: 'ng', name: 'Nigeria'},
      {code: 'eg', name: 'Egypt'},
      {code: 'nz', name: 'New Zealand'}
    ];

    fillTrack(fallbackFlags);

    fetch('https://restcountries.com/v3.1/all')
      .then(res => res.json())
      .then(data => {
        const countries = data
          .map(country => ({
            code: (country.cca2 || '').toLowerCase(),
            name: country.name && country.name.common ? country.name.common : ''
          }))
          .filter(country => country.code.length === 2)
          .sort((a, b) => a.name.localeCompare(b.name));

        if (countries.length) {
          fillTrack(countries);
        }
      })
      .catch(() => {
        // keep fallback flags if the API fails
      });
  })();

  // Photo viewer: click a photo to enlarge, click anywhere or press Esc to close
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  const closeLightbox = () => {
    lightbox.classList.remove("show");
    lightbox.setAttribute("aria-hidden", "true");
  };

  document.querySelectorAll(".photo-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const img = btn.querySelector("img");
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add("show");
      lightbox.setAttribute("aria-hidden", "false");
    });
  });

  lightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });
